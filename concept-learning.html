const ADMIN_PASSWORD = "wonjangnimAdmin2025!";

const TAB_INFO = {
  lit:  { label: "📖 문학 개념", color: "#3d6b52", bg: "#e8f4f0", concepts: LIT_CONCEPTS },
  gram: { label: "✏️ 문법 개념", color: "#2a4d8a", bg: "#e8eef8", concepts: GRAM_CONCEPTS },
};

const CATEGORIES_LIT  = [...new Set(LIT_CONCEPTS.map(c => c.category))];
const CATEGORIES_GRAM = [...new Set(GRAM_CONCEPTS.map(c => c.category))];

function App() {
  const [tab, setTab]           = useState("lit");
  const [nameInput, setNameInput] = useState("");
  const [studentName, setStudentName] = useState("");
  const [screen, setScreen]     = useState("home"); // home | learn | admin
  const [selectedCat, setSelectedCat] = useState(null);
  const [selectedConcept, setSelectedConcept] = useState(null);
  const [answers, setAnswers]   = useState({});
  const [revealed, setRevealed] = useState({});
  const [adminInput, setAdminInput] = useState("");
  const [adminError, setAdminError] = useState(false);
  const [results, setResults]   = useState({});

  const info = TAB_INFO[tab];
  const cats = tab === "lit" ? CATEGORIES_LIT : CATEGORIES_GRAM;

  // storage
  async function loadResults() {
    try {
      const r = await window.storage?.get("concept-results", true);
      if (r) setResults(JSON.parse(r.value));
    } catch {}
  }
  async function saveResult(conceptTitle, ansMap, questions) {
    try {
      let cur = {};
      try { const r = await window.storage?.get("concept-results", true); if (r) cur = JSON.parse(r.value); } catch {}
      if (!cur[studentName]) cur[studentName] = [];
      const score = questions.filter((q,i) => ansMap[i] === q.answer).length;
      const wrong = questions.map((q,i) => ({ q: q.q, chosen: ansMap[i], correct: q.answer, ok: ansMap[i] === q.answer }));
      cur[studentName].push({ title: conceptTitle, tab, date: new Date().toLocaleDateString("ko-KR"), score, total: questions.length, wrong });
      await window.storage?.set("concept-results", JSON.stringify(cur), true);
      setResults({ ...cur });
    } catch {}
  }

  const cKey = selectedConcept ? selectedConcept.title : "";
  const qAns = answers[cKey] || {};
  const qRev = revealed[cKey] || {};
  const allAnswered = selectedConcept ? selectedConcept.questions.every((_,i) => qAns[i] !== undefined) : false;
  const allRev = selectedConcept ? selectedConcept.questions.every((_,i) => qRev[i]) : false;
  const score = selectedConcept ? selectedConcept.questions.filter((q,i) => qAns[i] === q.answer).length : 0;

  function handleAnswer(qi, oi) {
    if (qRev[qi]) return;
    setAnswers(p => ({ ...p, [cKey]: { ...p[cKey], [qi]: oi } }));
  }
  function revealAll() {
    const nr = {}; selectedConcept.questions.forEach((_,i) => nr[i]=true);
    setRevealed(p => ({ ...p, [cKey]: nr }));
    saveResult(cKey, qAns, selectedConcept.questions);
  }
  function revealOne(qi) {
    setRevealed(p => ({ ...p, [cKey]: { ...p[cKey], [qi]: true } }));
  }

  // ── HOME ──
  if (screen === "home") return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, fontFamily:"'Noto Sans KR',sans-serif" }}>
      <div style={{ textAlign:"center", marginBottom:36 }}>
        <div style={{ fontSize:13, letterSpacing:5, color:"#7eb8d4", marginBottom:14, fontFamily:"'Noto Serif KR',serif" }}>국어 개념 학습</div>
        <div style={{ fontSize:32, fontWeight:700, color:"#fff", marginBottom:8, fontFamily:"'Noto Serif KR',serif", lineHeight:1.2 }}>문학 · 문법<br/>개념 완성</div>
        <div style={{ fontSize:13, color:"#7eb8d4" }}>중등 핵심 → 고등 연결</div>
      </div>
      <div style={{ width:"100%", maxWidth:360, background:"rgba(255,255,255,0.07)", borderRadius:20, padding:28, border:"1px solid rgba(255,255,255,0.12)", backdropFilter:"blur(10px)" }}>
        <div style={{ fontSize:13, color:"#aac8e0", marginBottom:10 }}>이름을 입력하고 시작하세요</div>
        <input value={nameInput} onChange={e=>setNameInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"&&nameInput.trim()){ setStudentName(nameInput.trim()); loadResults(); setScreen("learn"); }}}
          placeholder="예) 김민준"
          style={{ width:"100%", padding:"13px 16px", background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", borderRadius:10, color:"#fff", fontSize:15, marginBottom:12 }} />
        <button onClick={()=>{ if(nameInput.trim()){ setStudentName(nameInput.trim()); loadResults(); setScreen("learn"); }}}
          style={{ width:"100%", padding:14, background: nameInput.trim()?"#4a9fd4":"rgba(255,255,255,0.1)", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, transition:"all 0.2s" }}>
          시작하기 →
        </button>
        <button onClick={()=>setScreen("adminLogin")} style={{ width:"100%", marginTop:10, padding:10, background:"none", border:"none", color:"rgba(255,255,255,0.3)", fontSize:12 }}>관리자 로그인</button>
      </div>
    </div>
  );

  // ── ADMIN LOGIN ──
  if (screen === "adminLogin") return (
    <div style={{ minHeight:"100vh", background:"#1a1a2e", display:"flex", alignItems:"center", justifyContent:"center", padding:24, fontFamily:"'Noto Sans KR',sans-serif" }}>
      <div style={{ width:"100%", maxWidth:340, background:"#fff", borderRadius:16, padding:28 }}>
        <div style={{ fontSize:18, fontWeight:700, marginBottom:20, textAlign:"center" }}>🔐 관리자 로그인</div>
        <input type="password" value={adminInput} onChange={e=>setAdminInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"){ if(adminInput===ADMIN_PASSWORD){ loadResults(); setScreen("admin"); } else setAdminError(true); }}}
          placeholder="비밀번호" style={{ width:"100%", padding:"13px 16px", border:`1.5px solid ${adminError?"#e74c3c":"#ddd"}`, borderRadius:10, fontSize:15, marginBottom:8 }} />
        {adminError && <div style={{ color:"#e74c3c", fontSize:12, marginBottom:8 }}>비밀번호가 틀렸습니다.</div>}
        <button onClick={()=>{ if(adminInput===ADMIN_PASSWORD){ loadResults(); setScreen("admin"); } else setAdminError(true); }}
          style={{ width:"100%", padding:14, background:"#3d6b52", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700 }}>확인</button>
        <button onClick={()=>setScreen("home")} style={{ width:"100%", marginTop:8, padding:12, background:"none", border:"1px solid #ddd", borderRadius:10, color:"#888", fontSize:13 }}>돌아가기</button>
      </div>
    </div>
  );

  // ── ADMIN ──
  if (screen === "admin") {
    const students = Object.keys(results);
    return (
      <div style={{ minHeight:"100vh", background:"#f4f4f4", fontFamily:"'Noto Sans KR',sans-serif", paddingBottom:60 }}>
        <div style={{ background:"#fff", padding:"16px 20px", display:"flex", justifyContent:"space-between", alignItems:"center", borderBottom:"1px solid #eee" }}>
          <div style={{ fontSize:17, fontWeight:700 }}>📊 학생 학습 현황</div>
          <button onClick={()=>setScreen("home")} style={{ background:"none", border:"1px solid #ddd", color:"#888", padding:"7px 14px", borderRadius:8, fontSize:12 }}>로그아웃</button>
        </div>
        <div style={{ display:"flex", gap:10, padding:"14px 14px 0", flexWrap:"wrap" }}>
          {[
            { label:"참여 학생", value:students.length+"명" },
            { label:"총 학습 수", value:students.reduce((a,s)=>a+(results[s]?.length||0),0)+"회" },
          ].map((s,i)=>(
            <div key={i} style={{ flex:"1 1 100px", background:"#fff", borderRadius:12, padding:"12px 16px", boxShadow:"0 2px 8px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize:11, color:"#888", marginBottom:4 }}>{s.label}</div>
              <div style={{ fontSize:22, fontWeight:700, color:"#3d6b52" }}>{s.value}</div>
            </div>
          ))}
        </div>
        <div style={{ padding:14 }}>
          {students.length===0 && <div style={{ color:"#bbb", fontSize:13, padding:20, textAlign:"center" }}>아직 데이터가 없습니다.</div>}
          {students.map(name=>{
            const recs = results[name]||[];
            return (
              <div key={name} style={{ background:"#fff", borderRadius:12, padding:16, marginBottom:12, boxShadow:"0 2px 8px rgba(0,0,0,0.06)" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                  <div style={{ fontSize:15, fontWeight:700 }}>{name}</div>
                  <div style={{ fontSize:12, color:"#3d6b52" }}>{recs.length}개 학습 완료</div>
                </div>
                {recs.map((rec,ri)=>(
                  <div key={ri} style={{ background:"#f8f8f8", borderRadius:8, padding:10, marginBottom:8 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                      <span style={{ fontSize:12, color:"#888" }}>{rec.date} · {rec.tab==="lit"?"문학":"문법"} · {rec.title}</span>
                      <span style={{ fontSize:13, fontWeight:700, color: rec.score===rec.total?"#3d6b52": rec.score>=rec.total/2?"#e08a2a":"#e74c3c" }}>{rec.score}/{rec.total}</span>
                    </div>
                    {rec.wrong.filter(w=>!w.ok).map((w,wi)=>(
                      <div key={wi} style={{ fontSize:11, color:"#e07070", marginBottom:3, lineHeight:1.5 }}>
                        ✗ {w.q.length>30?w.q.slice(0,30)+"…":w.q} (선택:{(w.chosen||0)+1}번 · 정답:{w.correct+1}번)
                      </div>
                    ))}
                    {rec.wrong.every(w=>w.ok) && <div style={{ fontSize:11, color:"#3d6b52" }}>✓ 전체 정답!</div>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── LEARN ──
  return (
    <div style={{ minHeight:"100vh", background:"#f4f1ec", fontFamily:"'Noto Sans KR',sans-serif", paddingBottom:60 }}>
      {/* Header */}
      <div style={{ background:"#1a1a2e", padding:"13px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <div>
          <div style={{ fontSize:11, color:"#7eb8d4", letterSpacing:2 }}>국어 개념 학습</div>
          <div style={{ fontSize:15, fontWeight:700, color:"#fff" }}>{studentName} 님</div>
        </div>
        <button onClick={()=>{ setSelectedCat(null); setSelectedConcept(null); setScreen("home"); }}
          style={{ background:"none", border:"1px solid rgba(255,255,255,0.2)", color:"#aaa", padding:"7px 12px", borderRadius:8, fontSize:12 }}>나가기</button>
      </div>

      {/* Tab */}
      <div style={{ background:"#fff", display:"flex", borderBottom:"2px solid #ebebeb" }}>
        {Object.entries(TAB_INFO).map(([key,t])=>(
          <button key={key} onClick={()=>{ setTab(key); setSelectedCat(null); setSelectedConcept(null); }}
            style={{ flex:1, padding:"14px 8px", background:"none", border:"none", borderBottom: tab===key?`3px solid ${t.color}`:"3px solid transparent", fontSize:14, color: tab===key?t.color:"#aaa", fontWeight: tab===key?700:400 }}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{ maxWidth:600, margin:"0 auto", padding:"16px 14px" }}>

        {/* 개념 미선택: 카테고리 목록 */}
        {!selectedConcept && (
          <div className="fade">
            {selectedCat && (
              <button onClick={()=>setSelectedCat(null)} style={{ background:"none", border:"none", color:info.color, fontSize:13, fontWeight:600, marginBottom:14, padding:0 }}>← 카테고리 목록</button>
            )}
            {!selectedCat ? (
              <>
                <div style={{ fontSize:13, color:"#888", marginBottom:14 }}>카테고리를 선택하세요</div>
                {cats.map(cat=>{
                  const catConcepts = info.concepts.filter(c=>c.category===cat);
                  const done = catConcepts.filter(c => results[studentName]?.some(r=>r.title===c.title)).length;
                  return (
                    <button key={cat} onClick={()=>setSelectedCat(cat)}
                      style={{ width:"100%", padding:"18px 20px", background:"#fff", border:`1.5px solid ${info.color}33`, borderRadius:14, marginBottom:10, display:"flex", alignItems:"center", justifyContent:"space-between", boxShadow:"0 2px 8px rgba(0,0,0,0.04)", transition:"all 0.15s" }}>
                      <div style={{ textAlign:"left" }}>
                        <div style={{ fontSize:16, fontWeight:700, color:info.color }}>{cat}</div>
                        <div style={{ fontSize:12, color:"#aaa", marginTop:3 }}>개념 {catConcepts.length}개</div>
                      </div>
                      <div style={{ fontSize:12, color: done>0?info.color:"#ccc", fontWeight:700 }}>
                        {done>0?`${done}/${catConcepts.length} 완료`:"미시작"} →
                      </div>
                    </button>
                  );
                })}
              </>
            ) : (
              <>
                <div style={{ fontSize:13, color:"#888", marginBottom:14 }}>개념을 선택하세요</div>
                {info.concepts.filter(c=>c.category===selectedCat).map((c,i)=>{
                  const done = results[studentName]?.find(r=>r.title===c.title);
                  return (
                    <button key={i} onClick={()=>setSelectedConcept(c)}
                      style={{ width:"100%", padding:"16px 18px", background:"#fff", border:`1.5px solid ${done?info.color+"66":"#ebebeb"}`, borderRadius:12, marginBottom:10, display:"flex", alignItems:"center", gap:14, boxShadow:"0 2px 6px rgba(0,0,0,0.04)", transition:"all 0.15s" }}>
                      <div style={{ textAlign:"left", flex:1 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:"#1a1a1a", marginBottom:4 }}>{c.title}</div>
                        <div style={{ fontSize:12, color:"#aaa" }}>{c.summary.length>40?c.summary.slice(0,40)+"…":c.summary}</div>
                      </div>
                      <div style={{ textAlign:"right", flexShrink:0 }}>
                        {done && <div style={{ fontSize:12, color:info.color, fontWeight:700 }}>{done.score}/{done.total}</div>}
                        <div style={{ fontSize:18, color:"#ddd" }}>→</div>
                      </div>
                    </button>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* 개념 선택됨 */}
        {selectedConcept && (
          <div className="fade">
            <button onClick={()=>setSelectedConcept(null)} style={{ background:"none", border:"none", color:info.color, fontSize:13, fontWeight:600, marginBottom:14, padding:0 }}>← 목록으로</button>

            {/* 개념 헤더 */}
            <div style={{ background:info.bg, borderRadius:14, padding:"16px 18px", marginBottom:14, borderLeft:`4px solid ${info.color}` }}>
              <div style={{ fontSize:11, color:info.color, fontWeight:700, letterSpacing:1, marginBottom:4 }}>{selectedConcept.category}</div>
              <div style={{ fontSize:17, fontWeight:700, color:"#1a1a1a", marginBottom:6, fontFamily:"'Noto Serif KR',serif" }}>{selectedConcept.title}</div>
              <div style={{ fontSize:13, color:"#555", lineHeight:1.7 }}>{selectedConcept.summary}</div>
            </div>

            {/* 유튜브 버튼 */}
            {selectedConcept.youtube && (
              <a href={selectedConcept.youtube} target="_blank" rel="noopener noreferrer"
                style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 16px", background:"#ff4444", borderRadius:10, marginBottom:14, textDecoration:"none" }}>
                <span style={{ fontSize:20 }}>▶</span>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:"#fff" }}>영상으로 배우기</div>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.8)" }}>5~10분 강의 영상</div>
                </div>
              </a>
            )}

            {/* 개념 설명 */}
            <div style={{ marginBottom:20 }}>
              {selectedConcept.content.map((item,i)=>(
                <div key={i} style={{ background:"#fff", borderRadius:10, padding:"14px 16px", marginBottom:8, border:"1px solid #ebebeb" }}>
                  <div style={{ fontSize:13, fontWeight:700, color:info.color, marginBottom:6 }}>{item.label}</div>
                  <div style={{ fontSize:13, color:"#333", lineHeight:1.7, marginBottom: item.example?6:0 }}>{item.body}</div>
                  {item.example && (
                    <div style={{ fontSize:12, color:"#666", background:info.bg, borderRadius:6, padding:"7px 10px", lineHeight:1.7 }}>
                      예) {item.example}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 확인문제 */}
            <div style={{ fontSize:14, fontWeight:700, color:"#1a1a1a", marginBottom:12, borderTop:"2px solid #ebebeb", paddingTop:16 }}>
              ✅ 확인 문제
            </div>
            {selectedConcept.questions.map((q,qi)=>{
              const chosen = qAns[qi];
              const isRev  = qRev[qi];
              const ok     = chosen === q.answer;
              return (
                <div key={qi} style={{ background:"#fff", borderRadius:12, padding:"15px 14px", marginBottom:10, border: isRev?`1.5px solid ${ok?"#3d6b52":"#e74c3c"}`:"1.5px solid #ebebeb", boxShadow:"0 2px 6px rgba(0,0,0,0.04)" }}>
                  <div style={{ fontSize:13, fontWeight:600, color:"#1a1a1a", marginBottom:10, lineHeight:1.65 }}>
                    <span style={{ display:"inline-block", background:info.color, color:"#fff", borderRadius:4, padding:"1px 8px", fontSize:11, marginRight:7 }}>{qi+1}</span>
                    {q.q}
                  </div>
                  {q.options.map((opt,oi)=>{
                    let bg="#f9f9f9", border="1px solid #ebebeb", color="#333";
                    if(isRev){
                      if(oi===q.answer){ bg=info.bg; border=`1.5px solid ${info.color}`; color=info.color; }
                      else if(chosen===oi){ bg="#fdecea"; border="1.5px solid #e74c3c"; color="#c0392b"; }
                    } else if(chosen===oi){ bg=info.bg; border=`1.5px solid ${info.color}`; color=info.color; }
                    return (
                      <button key={oi} disabled={isRev} onClick={()=>handleAnswer(qi,oi)}
                        style={{ width:"100%", padding:"9px 12px", background:bg, border, borderRadius:7, marginBottom:6, color, fontSize:13, lineHeight:1.5, display:"flex", gap:8, alignItems:"flex-start", transition:"all 0.15s" }}>
                        <span style={{ fontWeight:700, minWidth:16, flexShrink:0, color: isRev&&oi===q.answer?info.color: isRev&&chosen===oi?"#e74c3c":"#bbb" }}>
                          {isRev&&oi===q.answer?"✓": isRev&&chosen===oi?"✗":`${oi+1}`}
                        </span>
                        <span>{opt}</span>
                      </button>
                    );
                  })}
                  {isRev && (
                    <div style={{ marginTop:10, padding:"10px 12px", background:info.bg, borderRadius:7, fontSize:12, color:"#444", lineHeight:1.7, borderLeft:`3px solid ${info.color}` }}>
                      <strong style={{ color:info.color }}>해설</strong> {q.exp}
                    </div>
                  )}
                  {!isRev && chosen!==undefined && (
                    <button onClick={()=>revealOne(qi)} style={{ marginTop:8, padding:"7px 14px", background:"none", border:`1.5px solid ${info.color}`, borderRadius:7, color:info.color, fontSize:12, fontWeight:600 }}>정답 확인</button>
                  )}
                </div>
              );
            })}

            {!allRev && (
              <button disabled={!allAnswered} onClick={revealAll}
                style={{ width:"100%", padding:15, background: allAnswered?info.color:"#ccc", color:"#fff", border:"none", borderRadius:12, fontSize:15, fontWeight:700, marginTop:4, transition:"all 0.2s" }}>
                {allAnswered?"전체 채점하기":"모든 문제를 풀어주세요"}
              </button>
            )}
            {allRev && (
              <div style={{ background: score===selectedConcept.questions.length?info.bg:"#fff8e8", border:`2px solid ${score===selectedConcept.questions.length?info.color:"#e08a2a"}`, borderRadius:14, padding:22, textAlign:"center", marginTop:8 }}>
                <div style={{ fontSize:32, marginBottom:8 }}>{score===selectedConcept.questions.length?"🎉":"📖"}</div>
                <div style={{ fontSize:22, fontWeight:700, marginBottom:6 }}>{score} / {selectedConcept.questions.length} 정답</div>
                <div style={{ fontSize:13, color:"#666", marginBottom:16 }}>
                  {score===selectedConcept.questions.length?"완벽합니다! 다음 개념으로 넘어가세요.":"해설을 꼼꼼히 읽고 다시 도전해보세요!"}
                </div>
                <button onClick={()=>{ setSelectedConcept(null); }}
                  style={{ padding:"11px 22px", background:info.color, color:"#fff", border:"none", borderRadius:10, fontSize:13, fontWeight:700 }}>
                  다른 개념 학습하기 →
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
