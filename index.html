<script>
window.storage = {
  async get(key, shared) {
    try {
      const k = shared ? 'shared_' + key : 'priv_' + key;
      const v = localStorage.getItem(k);
      if (v === null) throw new Error('not found');
      return { key, value: v, shared };
    } catch(e) { throw e; }
  },
  async set(key, value, shared) {
    try {
      const k = shared ? 'shared_' + key : 'priv_' + key;
      localStorage.setItem(k, value);
      return { key, value, shared };
    } catch(e) { return null; }
  },
  async delete(key, shared) {
    const k = shared ? 'shared_' + key : 'priv_' + key;
    localStorage.removeItem(k);
    return { key, deleted: true, shared };
  },
  async list(prefix, shared) {
    const p = shared ? 'shared_' + (prefix||'') : 'priv_' + (prefix||'');
    const keys = Object.keys(localStorage).filter(k=>k.startsWith(p));
    return { keys, prefix, shared };
  }
};
</script>

    { genre:"현대시",genreIcon:"詩",title:"우리가 물이 되어",author:"강은교",passage:`우리가 물이 되어 만난다면\n가문 어느 집에선들 좋아하지 않으랴.\n우리가 키 큰 나무와 함께 서서\n우르르 우르르 비 오는 소리로 흐른다면.\n\n흐르고 흘러서 저물녘엔\n저 혼자 깊어지는 강물에 누워\n죽은 나무 뿌리를 적시기도 한다면.\n가는 비 이슬비로 내려\n거미줄 위에 촘촘히 맺히기도 한다면.\n\n아아, 온몸의 흐름이여 아아`,passage:`우리가 물이 되어 만난다면\n가문 어느 집에선들 좋아하지 않으랴.\n우리가 키 큰 나무와 함께 서서\n우르르 우르르 비 오는 소리로 흐른다면.\n\n흐르고 흘러서 저물녘엔\n저 혼자 깊어지는 강물에 누워\n죽은 나무 뿌리를 적시기도 한다면.\n가는 비 이슬비로 내려\n거미줄 위에 촘촘히 맺히기도 한다면.`,
      questions:[
        {q:"이 시에서 '물'이 상징하는 가치로 가장 적절한 것은?",options:["물질적 풍요와 경제적 번영","생명을 살리는 헌신적이고 이타적인 사랑","자유롭게 흐르는 개인주의적 삶","자연의 파괴적 힘과 위협","시간의 흐름과 인생의 무상함"],answer:1,explanation:"가문 집을 적시고, 죽은 나무 뿌리를 살리고, 거미줄에 맺히는 물의 이미지는 생명을 주고 타자를 살리는 헌신적 사랑을 상징합니다."},
        {q:"'우리가 물이 되어 만난다면'의 가정법이 만들어내는 효과로 가장 적절한 것은?",options:["현실에서 이루어진 만남의 기쁨을 표현한다.","현실에서는 어려운 이상적 만남에 대한 소망을 담아낸다.","과거에 있었던 아름다운 만남을 회상한다.","미래에 반드시 이루어질 만남을 예언한다.","상대방에 대한 조건부 사랑을 표현한다."],answer:1,explanation:"'~만난다면'의 가정법은 현실에서 쉽게 실현되지 않는 이상적이고 헌신적인 만남·사랑에 대한 소망을 드러냅니다."},
        {q:"이 시의 시상 전개 방식으로 가장 적절한 것은?",options:["시간의 순서에 따라 사건이 전개된다.","물의 다양한 변화·순환을 통해 사랑의 다양한 모습을 형상화한다.","대립적 이미지를 교차하여 갈등을 심화한다.","화자와 청자의 대화 형식으로 진행된다.","계절의 변화에 따라 화자의 정서가 변화한다."],answer:1,explanation:"물이 비→강물→이슬비→거미줄의 이슬로 변화·순환하는 과정을 통해 다양한 형태의 헌신적 사랑을 형상화하고 있습니다."},
      ]
    },
    { genre:"현대소설",genreIcon:"小",title:"난장이가 쏘아올린 작은 공",author:"조세희",passage:`아버지는 난장이였다. 키가 117센티미터밖에 안 되는 난장이. 그러나 나는 아버지를 사랑했다. 아버지는 힘들게 살면서도 꿈을 잃지 않았다. 달나라에 가고 싶다고 했다. 달나라에는 아름다운 것들만 있다고 했다.\n그러나 현실에서 아버지는 재개발로 집을 잃었다. 철거반원들이 왔을 때 어머니는 울었고, 아버지는 말이 없었다. 우리 가족은 낙원구 행복동에서 쫓겨났다.`,
      questions:[
        {q:"'난장이'라는 존재가 이 소설에서 갖는 상징적 의미로 가장 적절한 것은?",options:["신체적 장애를 가진 인물의 고통을 사실적으로 재현한 것","산업화 시대에 소외되고 억압받는 도시 빈민 계층의 상징","사회에 적응하지 못하는 개인의 심리적 좌절을 표현한 것","전통 사회에서 차별받던 특수 신분 계층의 상징","현대 문명에 저항하는 원시적 순수함의 상징"],answer:1,explanation:"'난장이'는 작고 힘없는 존재로, 1970년대 산업화·도시화 과정에서 재개발로 삶터를 잃는 도시 빈민 계층 전체를 상징하는 인물입니다."},
        {q:"'낙원구 행복동'이라는 지명이 갖는 효과로 가장 적절한 것은?",options:["실제로 아름다운 지역임을 사실적으로 표현한 것","지명과 현실의 괴리를 통한 반어적 효과로 빈민의 비참함을 강조한다.","주인공 가족이 행복한 삶을 누렸던 공간임을 나타낸다.","유토피아적 이상 세계를 상징하는 공간이다.","개발 이전 아름다운 자연 환경을 나타내는 지명이다."],answer:1,explanation:"'낙원'과 '행복'이라는 이름과 달리 실제로 철거와 가난에 시달리는 공간이라는 반어적 대조가 빈민의 현실적 비참함을 더욱 부각합니다."},
        {q:"아버지가 '달나라에 가고 싶다'고 하는 것의 의미로 가장 적절한 것은?",options:["우주 개발에 대한 시대적 관심을 반영한 것","현실의 고통을 벗어난 이상적 세계에 대한 꿈과 도피 욕망","과학 기술 발전에 대한 낙관적 신뢰","신앙적 세계관에서 천국을 달나라로 표현한 것","자녀들에게 꿈을 심어주려는 교육적 의도"],answer:1,explanation:"달나라는 현실(재개발·가난·소외)의 반대편에 있는 아름다운 이상 세계로, 고통스러운 현실을 벗어나고 싶은 도피 욕망과 꿈을 상징합니다."},
      ]
    },
    { genre:"고전시가",genreIcon:"歌",title:"제망매가",author:"월명사",passage:`생사 길은\n예 있으매 머뭇거리고,\n나는 간다는 말도\n못다 이르고 어찌 갑니까.\n\n어느 가을 이른 바람에\n이에 저에 떨어질 잎처럼,\n한 가지에 나고\n가는 곳 모르온저.\n\n아아, 미타찰에서 만날 나\n도 닦아 기다리겠노라.`,
      questions:[
        {q:"이 향가에서 떨어지는 '잎'의 비유가 의미하는 바로 가장 적절한 것은?",options:["가을 자연의 아름다운 쇠락을 묘사한 것","한 부모에게서 태어난 남매가 죽음으로 인해 제각각 헤어짐을 비유한 것","인생의 무상함을 자연 현상으로 표현한 것","이별 후 두 사람이 다시 만나게 될 것을 암시하는 것","죽음에 대한 공포를 자연물에 투영한 것"],answer:1,explanation:"'한 가지에 나고'는 같은 부모에게서 태어남을, '이에 저에 떨어질 잎'은 죽음으로 인해 남매가 제각각 헤어짐을 비유합니다."},
        {q:"마지막 연 '미타찰에서 만날 나 / 도 닦아 기다리겠노라'에서 드러나는 화자의 태도로 가장 적절한 것은?",options:["죽음에 대한 극도의 공포와 절망","불교적 내세관을 바탕으로 한 슬픔의 종교적 승화","누이에 대한 원망과 억울함의 표출","죽음의 부당함에 대한 현실적 저항","죽은 누이를 잊고 새 삶을 살겠다는 의지"],answer:1,explanation:"극락(미타찰)에서 다시 만나겠다는 불교적 내세 신앙으로 슬픔을 극복하고 종교적으로 승화하는 태도를 보입니다."},
        {q:"제망매가의 형식적 특징으로 가장 적절한 것은?",options:["3·4조의 율격을 지닌 평시조이다.","10구체 향가로 낙구에서 감탄사로 시상을 전환한다.","4음보 연속체의 가사 형식이다.","3장 6구 형식의 시조이다.","4·4조 음수율의 고려 속요이다."],answer:1,explanation:"제망매가는 신라 향가의 완성형인 10구체 향가로, 9행에서 '아아'라는 감탄사(낙구)로 시작하며 시상을 전환·집약하는 형식적 특징을 지닙니다."},
      ]
    },
    { genre:"고전소설",genreIcon:"傳",title:"토끼전 (일부)",author:"작자 미상",passage:`용왕이 병이 깊어 백약이 무효라, 신하들이 의논하기를, 토끼의 간이 명약이라 하거늘, 자라를 불러 이르되,\n"네가 육지에 나가 토끼를 잡아 오면 큰 상을 내리리라."\n자라 육지에 올라 토끼를 만나 용궁의 아름다움을 늘어놓으니, 토끼가 귀가 솔깃하여 함께 용궁으로 내려갔더라. 용왕 앞에 잡혀 온 토끼, 간을 내놓으라 하자 태연히 웃으며,\n"소토가 원래 간을 꺼내어 씻는 버릇이 있사온데, 오늘도 간을 육지에 두고 왔사오니, 다시 나가 가져오리이다."`,
      questions:[
        {q:"이 작품에서 토끼의 '간을 두고 왔다'는 말이 보여주는 서사적 기능으로 가장 적절한 것은?",options:["토끼가 용왕에게 충성을 맹세하는 장면이다.","약자가 위기에서 기지와 언변으로 탈출하는 반전 장면이다.","토끼가 자신의 죽음을 수용하는 체념의 장면이다.","자라의 속임수가 밝혀지는 갈등 고조 장면이다.","용왕의 어리석음이 처음으로 드러나는 장면이다."],answer:1,explanation:"죽음의 위기에서 토끼가 재치 있는 거짓말로 탈출 기회를 만드는 이 장면은, 강자에 맞선 약자의 기지를 보여주는 핵심 반전 장면입니다."},
        {q:"토끼전에 담긴 풍자의 대상으로 가장 적절한 것은?",options:["농민을 착취하는 지주 계층","무능하고 탐욕스러운 지배층(용왕·신하)과 그들의 권력 남용","외세의 침략에 무력한 조선 군대","상업적 이익만 추구하는 상인 계층","자연을 파괴하는 인간 문명"],answer:1,explanation:"병든 용왕(무능한 군주)이 신하들의 말만 믿고 토끼를 잡으려는 행태는 지배층의 어리석음과 탐욕을 풍자하며, 이를 꾀로 이기는 토끼는 민중을 대변합니다."},
        {q:"이 작품의 장르적 성격으로 가장 적절한 것은?",options:["판소리계 소설로, 해학과 풍자를 통해 사회를 비판하는 성격을 지닌다.","영웅소설로, 비범한 주인공의 일대기를 통해 민족 정기를 고양한다.","가정소설로, 가정 내 갈등과 화해를 중심으로 윤리를 교훈한다.","몽유록으로, 꿈속 세계의 경험을 통해 현실을 비판한다.","전기소설로, 현실에서 불가능한 사건을 통해 이상을 추구한다."],answer:0,explanation:"토끼전(수궁가)은 판소리에서 파생된 판소리계 소설로, 해학적 문체와 사회 풍자가 결합된 장르적 특성을 지닙니다."},
      ]
    },
  ],
  [
    { genre:"현대시",genreIcon:"詩",title:"꽃",author:"김춘수",passage:`내가 그의 이름을 불러 주기 전에는\n그는 다만\n하나의 몸짓에 지나지 않았다.\n\n내가 그의 이름을 불러 주었을 때,\n그는 나에게로 와서\n꽃이 되었다.\n\n내가 그의 이름을 불러 준 것처럼\n나의 이 빛깔과 향기에 알맞은\n누가 나의 이름을 불러다오.\n그에게로 가서 나도\n그의 꽃이 되고 싶다.\n\n우리들은 모두\n무엇이 되고 싶다.\n나는 너에게 너는 나에게\n잊혀지지 않는 하나의 눈짓이 되고 싶다.`,
      questions:[
        {q:"이 시에서 '이름을 부른다'는 행위의 철학적 의미로 가장 적절한 것은?",options:["대상을 분류하고 구별하는 언어의 도구적 기능","대상의 본질을 인식하고 의미 있는 존재로 만드는 행위","대상에 대한 소유권을 주장하는 행위","관계의 단절을 선언하는 의식적 행위","대상의 외형적 특성을 묘사하는 행위"],answer:1,explanation:"이름을 불러주기 전 '몸짓'에 불과하던 것이 '꽃'이 되는 과정은, 인식과 관계를 통해 존재가 의미를 얻는다는 실존주의적 철학을 담고 있습니다."},
        {q:"3연에서 화자가 '나의 이름을 불러다오'라고 말하는 이유로 가장 적절한 것은?",options:["자신의 정체성을 잃어버려 혼란스럽기 때문이다.","타인에게 인식되고 의미 있는 존재가 되고 싶은 소망 때문이다.","자신의 아름다움을 자랑하고 싶은 허영심 때문이다.","고독한 삶에서 벗어나 군중 속에 속하고 싶기 때문이다.","자신을 부를 수 있는 특별한 사람을 찾고 있기 때문이다."],answer:1,explanation:"화자도 누군가에게 이름 불림으로써 '꽃'처럼 의미 있는 존재로 인식되고 싶다는 것으로, 상호 인정과 의미 있는 관계에 대한 소망을 나타냅니다."},
        {q:"마지막 연 '잊혀지지 않는 하나의 눈짓'이 의미하는 것으로 가장 적절한 것은?",options:["시각적으로 아름다운 외모","서로에게 의미 있는 존재로 기억되는 것","일회적 만남의 아쉬움을 나타내는 것","상대에 대한 경계심을 표현하는 것","이별 후 그리움을 표현하는 것"],answer:1,explanation:"'잊혀지지 않는'은 기억됨, '눈짓'은 소통의 신호로, 서로에게 의미 있고 기억되는 존재가 되고 싶다는 상호 인정의 소망을 담고 있습니다."},
      ]
    },
    { genre:"현대소설",genreIcon:"小",title:"광장",author:"최인훈",passage:`이명준은 두 개의 광장 사이에서 고뇌했다. 남한의 광장은 텅 비어 있었다. 개인의 욕망만이 난무하는 밀실의 사회였다. 북한의 광장은 꽉 차 있었으나 그것은 공허한 이념으로 채워진 것이었다.\n그는 어느 쪽에서도 진정한 인간의 삶을 찾지 못했다. 그래서 그는 제3국행 배를 탔다. 망망한 바다 위에서 이명준은 갈매기들이 날아오르는 것을 바라보았다.`,
      questions:[
        {q:"'밀실'과 '광장'의 대립이 이 소설에서 상징하는 바로 가장 적절한 것은?",options:["밀실 - 개인의 사생활 / 광장 - 공적 공간","밀실 - 개인적 욕망에 매몰된 남한의 공허한 자유 / 광장 - 이념으로 채워진 북한의 전체주의","밀실 - 과거의 억압 / 광장 - 미래의 해방","밀실 - 농촌 공동체 / 광장 - 도시 문명","밀실 - 자본주의 / 광장 - 사회주의의 물리적 공간"],answer:1,explanation:"남한의 '밀실'(개인 욕망만 추구하는 공허한 자유민주주의)과 북한의 '광장'(공허한 이념으로 채워진 전체주의)의 대립이 이 소설의 핵심 구도입니다."},
        {q:"이명준이 제3국행 배를 선택한 이유로 가장 적절한 것은?",options:["더 나은 경제적 기회를 찾아 떠나는 것이다.","남한과 북한 어느 쪽에서도 진정한 삶을 찾지 못한 실존적 탈출이다.","사랑하는 여인을 따라 떠나는 낭만적 선택이다.","이념적 신념에 따라 중립국을 지지하는 정치적 선택이다.","전쟁을 피하기 위한 현실적 도피이다."],answer:1,explanation:"남과 북 모두에서 진정한 인간적 삶을 찾지 못한 이명준의 제3국행은 이념과 체제를 거부한 실존적·철학적 탈출의 선택입니다."},
        {q:"이 소설의 역사적·문학적 의의로 가장 적절한 것은?",options:["최초의 한국 근대소설로 근대문학의 시작을 알린다.","분단 현실을 정면으로 다루며 이념 대립을 비판한 한국 최초의 분단 소설이다.","노동자 계급의 현실을 사실적으로 묘사한 사회주의 리얼리즘 소설이다.","전통적 가족 제도의 붕괴를 다룬 최초의 가정소설이다.","일제강점기 저항 의식을 담은 민족 서사시적 소설이다."],answer:1,explanation:"광장(1960)은 남북 분단의 이념적 대립을 직접적으로 다루며 어느 쪽도 진정한 인간의 삶을 보장하지 못한다고 비판한 한국 최초의 분단소설로 평가받습니다."},
      ]
    },
    { genre:"고전시가",genreIcon:"歌",title:"정과정",author:"정서",passage:`내 님을 그리워하와 우러 넘어 자니\n산접동새 난 이슷하요이다\n아니시며 거츠르신 긋\n잔월효성이 아시리이다\n넋이라도 님은 한데 녀져라 아으\n벼기더시니 뉘러시니잇가\n과(過)도 허물도 천만 없소이다\n힛므른 아으 동동다리`,
      questions:[
        {q:"이 작품에서 화자가 '산접동새'에 감정을 이입하는 이유로 가장 적절한 것은?",options:["새가 자유롭게 날 수 있어 부러워서","접동새처럼 억울한 사연을 품고 슬피 우는 자신의 처지와 닮았기 때문에","새가 임금이 있는 곳으로 소식을 전해줄 수 있기 때문에","아름다운 새소리가 임금의 음악과 같기 때문에","새가 영물이라 자신의 억울함을 풀어줄 것 같아서"],answer:1,explanation:"정서는 억울하게 귀양 가 울며 지내는 자신의 처지를, 슬피 우는 접동새에 빗대어 감정 이입하여 자신의 억울한 심정을 호소합니다."},
        {q:"'잔월효성이 아시리이다'에서 잔월효성(새벽달과 샛별)을 증거로 내세우는 이유로 가장 적절한 것은?",options:["새벽의 아름다움을 예찬하기 위해","자신의 결백과 충정을 증명해줄 객관적 증거로 삼기 위해","자연의 섭리를 통해 인간의 무상함을 드러내기 위해","임금이 새벽달과 샛별을 좋아했기 때문에","자연물에 소원을 빌기 위한 기도 행위로서"],answer:1,explanation:"밤새 울며 지낸 화자의 충정과 결백을 새벽달과 샛별만은 알고 있다고 함으로써, 자신의 억울함을 자연물을 증거 삼아 호소하는 것입니다."},
        {q:"정과정의 장르적 특성으로 가장 적절한 것은?",options:["3장 6구의 평시조이다.","현전하는 유일한 고려 가요 작가의 작품으로, 향가와 속요의 과도기적 성격을 보인다.","4·4조 음수율의 가사이다.","집단 창작된 무명씨의 민요이다.","10구체 향가이다."],answer:1,explanation:"정과정은 정서(鄭叙)라는 실명 작가가 남긴 현존 유일한 고려 가요 작품으로, 향가적 잔영과 속요적 특성이 혼재하는 과도기적 형식을 보입니다."},
      ]
    },
    { genre:"고전소설",genreIcon:"傳",title:"금오신화 — 만복사저포기 (일부)",author:"김시습",passage:`양생이 만복사에 홀로 앉아 저포를 던지며 홀로 놀더니, 문득 한 여인이 나타나 함께 어울렸다. 여인의 자태는 빼어났고 말씨는 고왔다. 둘은 시를 주고받으며 밤을 지새웠다.\n날이 밝자 여인이 말하기를,\n"저는 사실 인간이 아니오이다. 왜구에 희생되어 원통하게 죽은 영혼이옵니다. 낭군의 사랑 덕분에 한이 풀렸사오니, 이제 하직을 고하나이다."\n양생은 망연히 여인이 사라지는 것을 바라볼 뿐이었다.`,
      questions:[
        {q:"이 작품의 주인공 여인이 귀신이라는 설정이 갖는 의미로 가장 적절한 것은?",options:["공포 소설적 요소로 독자의 흥미를 자극하기 위해","왜구 침략으로 억울하게 죽은 민중의 원한을 형상화하기 위해","신선 세계에 대한 동경을 표현하기 위해","불교의 윤회 사상을 설명하기 위해","남주인공의 비현실적 사랑을 합리화하기 위해"],answer:1,explanation:"귀신 여인은 왜구의 침략으로 억울하게 죽은 존재로, 역사적 비극(왜란)으로 희생된 민중의 원한과 슬픔을 문학적으로 형상화한 것입니다."},
        {q:"금오신화가 한국 소설사에서 갖는 위치로 가장 적절한 것은?",options:["최초의 한글 소설이다.","한국 최초의 한문 소설로, 전기(傳奇)소설의 효시이다.","최초의 판소리계 소설이다.","한국 최초의 영웅소설이다.","최초의 역사소설이다."],answer:1,explanation:"김시습의 금오신화는 한국 최초의 한문 소설로, 현실에서 불가능한 사건(귀신과의 사랑)을 다루는 전기(傳奇)소설 양식을 개척한 작품입니다."},
        {q:"'양생'과 귀신 여인의 하룻밤 만남이 끝나는 방식이 주는 정서로 가장 적절한 것은?",options:["권선징악적 교훈으로 인한 정의감","이루어질 수 없는 만남의 아름다움과 허무, 인생무상감","신기한 이야기에 대한 호기심과 경이감","사랑의 성취에서 오는 충만감","억울한 죽음에 대한 분노"],answer:1,explanation:"하룻밤의 아름다운 만남이 날이 밝자 사라지는 구조는 이루어질 수 없는 사랑의 아름다움과 동시에 허무·인생무상의 정서를 남깁니다."},
      ]
    },

  [
    { genre:"현대시",genreIcon:"詩",title:"추억에서",author:"박재삼",passage:`진주 장터 생어물전에는\n바닷밤이 좋아 설별이 보이지 않는다.\n\n앞 물은 짜고 뒷 물은 밍밍하고\n어머니의 손 등은 파랗게 젖었다.\n\n평생을 에워싼 구름들이 갈 곳을 잃어\n눈물이 났다.`,
      questions:[
        {q:"이 시에서 '어머니의 손 등이 파랗게 젖었다'의 의미로 가장 적절한 것은?",options:["어머니가 바닷물에 빠진 위험한 상황을 묘사한 것","고된 삶을 살아온 어머니의 고단하고 거친 삶을 감각적으로 표현한 것","어머니가 장터에서 생선을 씻는 일상적 행위를 묘사한 것","어머니의 병든 모습을 나타내는 것","추위에 떠는 어머니의 모습을 시각적으로 나타낸 것"],answer:1,explanation:"파랗게 젖은 손 등은 오랜 시간 장터에서 일해온 어머니의 거칠고 고된 삶 자체를 압축적으로 보여주는 시각·촉각적 이미지입니다."},
        {q:"이 시의 정서적 특성으로 가장 적절한 것은?",options:["강인한 의지와 저항 정신","한(恨)의 정서와 가난하고 고단한 삶에 대한 애잔한 슬픔","자연에 대한 낭만적 예찬","이별의 슬픔을 체념으로 극복하는 정서","도시 문명에 대한 비판과 저항"],answer:1,explanation:"진주 장터의 어머니, 짜고 밍밍한 물, 파랗게 젖은 손 등의 이미지는 가난하고 고단한 삶에 대한 애잔한 슬픔과 한(恨)의 정서를 담고 있습니다."},
        {q:"'앞 물은 짜고 뒷 물은 밍밍하고'에 사용된 감각적 표현의 특징으로 가장 적절한 것은?",options:["시각 이미지만을 사용하여 장터의 풍경을 묘사한다.","미각 이미지를 활용하여 어머니 삶의 복잡한 감정을 구체화한다.","청각 이미지로 장터의 생동감을 표현한다.","후각 이미지로 바다 내음을 전달한다.","촉각 이미지로 물의 차가움을 표현한다."],answer:1,explanation:"'짜고 밍밍하고'는 미각 이미지를 활용하여, 고달프고도 익숙한 어머니의 삶의 복잡한 감정(한·슬픔·체념)을 감각적으로 구체화합니다."},
      ]
    },
    { genre:"현대소설",genreIcon:"小",title:"객지",author:"황석영",passage:`동혁은 공사판을 떠돌며 살았다. 어디에도 정착하지 못하고 언제나 낯선 곳에서 낯선 사람들과 일했다. 오늘은 이 공사판, 내일은 저 공사판. 몸을 팔아 하루하루를 연명하는 삶이었다.\n새벽 네 시에 일어나 막일을 하고 저녁 늦게 함바에 돌아오면 온몸이 욱신거렸다. 그래도 동혁은 살았다. 왜 사는지 몰랐지만 살아 있었다.\n어느 날 현장에서 사고가 났다. 안전 시설도 없는 공사판에서 동료 하나가 떨어졌다.`,
      questions:[
        {q:"이 소설에서 '공사판을 떠돌며' 사는 동혁의 삶이 상징하는 것으로 가장 적절한 것은?",options:["개인의 무능함으로 인한 사회 부적응","1970년대 산업화 과정에서 소외된 이주 노동자의 삶","자유로운 삶을 선택한 개인주의자의 방랑","농촌 공동체 해체에 대한 향수","전쟁 후 고향을 잃은 실향민의 삶"],answer:1,explanation:"동혁의 떠도는 공사판 노동자 삶은 1970년대 급격한 산업화·도시화 과정에서 정착하지 못하고 소외된 이주 노동자 계층을 대표합니다."},
        {q:"'안전 시설도 없는 공사판에서 동료가 떨어진' 사고가 서사에서 갖는 기능으로 가장 적절한 것은?",options:["주인공의 공사 기술이 뛰어남을 부각하는 사건이다.","열악한 노동 환경과 노동자의 희생을 통해 사회적 모순을 고발하는 역할을 한다.","동혁이 이 공사판을 떠나는 계기가 되는 단순한 사건이다.","노동의 위험성에 대한 경각심을 교훈적으로 전달하는 것이다.","동료 간의 우정이 깊어지는 계기로 기능한다."],answer:1,explanation:"안전 시설 없는 공사판의 사고는 당시 노동자를 보호하지 않는 구조적 문제를 드러내며, 산업화의 이면에 있는 사회적 모순을 고발하는 핵심 사건입니다."},
        {q:"황석영의 객지가 속하는 문학적 경향으로 가장 적절한 것은?",options:["순수문학 - 현실과 무관한 심미적 아름다움을 추구한다.","민중문학·리얼리즘 - 1970년대 산업화의 이면과 노동자 현실을 사실적으로 고발한다.","모더니즘 - 의식의 흐름 기법으로 개인의 내면을 탐구한다.","낭만주의 - 이상적 자연과 인간의 합일을 추구한다.","실존주의 - 삶의 무의미를 철학적으로 탐구한다."],answer:1,explanation:"객지는 1970년대 유신 시대 산업화의 그늘에서 소외된 노동자의 현실을 사실적으로 형상화한 민중문학·리얼리즘 계열의 대표 소설입니다."},
      ]
    },
    { genre:"고전시가",genreIcon:"歌",title:"찬기파랑가",author:"충담사",passage:`흰 구름 좇아 떠가는\n흰 달이 흰 물가에 가 있는 듯\n기파랑의 모습이시여.\n\n일오 냇가 자갈벌에\n기파랑이 지니시던\n마음의 끝을 좇고파.\n\n아아, 잣나무 가지가 높아\n눈이라도 덮지 못할\n화랑의 마음이시여.`,
      questions:[
        {q:"이 향가에서 '흰 달', '잣나무 가지'가 공통으로 상징하는 것으로 가장 적절한 것은?",options:["자연의 아름다움과 순환","기파랑의 고결하고 흔들리지 않는 인품과 기개","불교적 깨달음의 경지","화랑도의 무예적 강인함","화자의 고독한 심경"],answer:1,explanation:"'흰 달'의 순결함과 '눈도 덮지 못하는 잣나무 가지'의 강인함은 모두 기파랑의 고결하고 절개 있는 인품을 자연물을 통해 상징합니다."},
        {q:"이 작품에서 화자가 '기파랑의 마음의 끝을 좇고파'라고 하는 것의 의미로 가장 적절한 것은?",options:["기파랑의 뛰어난 무예 실력을 배우고 싶다는 것","기파랑의 고결한 정신과 인품을 본받고 싶다는 흠모의 마음","기파랑이 사라진 곳을 찾아가고 싶다는 것","기파랑이 남긴 업적을 후세에 알리고 싶다는 것","기파랑과 함께 무술을 연마하고 싶다는 것"],answer:1,explanation:"기파랑의 '마음의 끝'을 쫓는다는 것은 그의 숭고한 정신과 고결한 인품을 따르고 본받고 싶다는 흠모와 추모의 마음을 표현합니다."},
        {q:"찬기파랑가가 향가 중에서 차지하는 문학적 위상으로 가장 적절한 것은?",options:["최초의 향가로 향가의 효시가 되는 작품이다.","자연물을 통해 인물의 고결한 인품을 찬양한 서정적 완성도가 높은 10구체 향가이다.","불교 의식에 사용된 종교적 향가이다.","역사적 사건을 기록한 서사 향가이다.","임금에 대한 충성을 노래한 충신연주지사이다."],answer:1,explanation:"찬기파랑가는 자연 이미지를 활용하여 화랑 기파랑의 고결한 인품을 찬양한 작품으로, 서정적 완성도와 표현 기법이 뛰어난 10구체 향가의 걸작으로 평가받습니다."},

    { genre:"고전소설",genreIcon:"傳",title:"양반전 (일부)",author:"박지원",passage:`군수가 양반의 증서를 고을 사람들 앞에서 읽어 주었다.\n"양반이 지켜야 할 일: 새벽에 일어나 세수하고 도포를 입고 관을 쓰고 단정히 앉아 책을 읽을 것. 밥을 먹되 좁쌀밥을 먹더라도 후루룩 먹지 말 것…"\n부자가 얼굴이 허옇게 질려,\n"그것이 전부입니까? 겨우 그것을 위해 이런 고통을 당한다는 말이오?"\n하고는 두 번 다시 양반이 되겠다는 말을 하지 않았다.`,
      questions:[
        {q:"이 작품에서 풍자의 대상과 방법으로 가장 적절한 것은?",options:["양반의 빈곤함 자체를 조롱하여 신분제를 옹호한다.","양반의 허례허식과 실질 없는 규범을 열거함으로써 무능한 양반 계층을 풍자한다.","부자의 탐욕을 비판하여 상업 자본가의 문제를 드러낸다.","군수의 부패를 폭로하여 관료제의 부조리를 고발한다.","농민의 고통을 통해 세금 제도의 문제를 비판한다."],answer:1,explanation:"형식적 예절만 가득한 양반의 규범을 나열함으로써, 실제 능력도 없이 허례허식만 갖춘 양반 계층의 공허함을 간접적으로 풍자합니다."},
        {q:"부자가 양반이 되기를 포기하는 행동이 갖는 서사적 의미로 가장 적절한 것은?",options:["부자가 양반보다 더 행복한 계층임을 증명하는 것","양반 신분의 실질적 가치가 허명(虛名)에 불과함을 폭로하는 반전 장면이다.","부자가 도덕적으로 성숙해지는 성장의 계기이다.","신분제를 오히려 강화해야 한다는 주장을 뒷받침하는 것이다.","부자와 양반이 화해하는 화합의 장면이다."],answer:1,explanation:"돈으로 양반 신분을 사려던 부자가 그 내용을 듣고 포기하는 반전은, 양반 신분이 실상은 텅 빈 허명이며 아무런 실질적 가치가 없음을 폭로하는 핵심 장면입니다."},
        {q:"양반전이 창작된 문학적·사상적 배경으로 가장 적절한 것은?",options:["성리학적 질서를 회복하기 위한 보수적 목적으로 창작되었다.","실학사상의 영향을 받아 조선 후기 신분제의 모순을 비판하기 위해 창작되었다.","불교의 평등 사상을 전파하기 위해 창작되었다.","서학(천주교)의 인간 평등 사상을 반영하여 창작되었다.","도가사상을 통해 무위자연의 삶을 권유하기 위해 창작되었다."],answer:1,explanation:"박지원은 연암 특유의 실학적 관점에서, 능력 없이 신분만 내세우는 양반 계층의 무능함과 조선 신분제의 모순을 날카롭게 비판하기 위해 양반전을 창작했습니다."},

  [
    { genre:"현대시",genreIcon:"詩",title:"성북동 비둘기",author:"김광섭",passage:`성북동 산에 번지가 새로 생기면서\n본래 살던 성북동 비둘기만이 번지가 없어졌다.\n새벽부터 돌 깨는 산울림에 떨다가\n가슴에 금이 갔다.\n\n그래도 성북동 비둘기는\n하느님의 광장 같은 새파란 아침 하늘에\n성북동 주민에게 평화를 배달하러 한다.`,
      questions:[
        {q:"이 시에서 '비둘기'가 상징하는 것으로 가장 적절한 것은?",options:["하늘의 자유로움을 즐기는 순수한 자연","도시화·개발로 삶터를 잃은 소외된 존재(도시 빈민·자연)","평화의 상징으로서 전쟁 종식을 염원하는 것","하느님의 사자로서 종교적 의미를 지닌 존재","인간의 탐욕에 맞서 저항하는 강인한 존재"],answer:1,explanation:"본래 살던 곳에서 번지(주소)를 잃은 비둘기는, 급격한 도시화·개발로 삶터를 잃고 소외된 존재(도시 빈민 또는 훼손된 자연)를 상징합니다."},
        {q:"'가슴에 금이 갔다'의 의미로 가장 적절한 것은?",options:["비둘기가 물리적으로 다쳤음을 나타낸다.","삶터를 잃고 상처받은 비둘기의 내면적 고통과 상처를 표현한다.","비둘기의 가슴 무늬를 묘사하는 것이다.","개발에 대한 비둘기의 분노를 나타낸다.","비둘기가 죽어가고 있음을 암시한다."],answer:1,explanation:"물리적 상처가 아닌 삶터를 잃고 새벽부터 돌 깨는 소리에 떠는 비둘기의 내면적 상처와 고통을 '가슴에 금이 갔다'는 표현으로 형상화한 것입니다."},
        {q:"마지막 연에서 비둘기가 '평화를 배달하러 한다'는 표현의 아이러니로 가장 적절한 것은?",options:["비둘기가 실제로 평화를 가져다줄 수 있다는 낙관적 메시지이다.","삶터를 잃고 상처받은 비둘기가 오히려 평화를 전하려 한다는 역설로 개발의 부조리함을 부각한다.","평화보다 생존이 우선이라는 현실적 교훈을 담은 것이다.","비둘기의 숭고한 희생 정신을 칭송하는 것이다.","인간 사회의 위선을 비유적으로 고발하는 것이다."],answer:1,explanation:"정작 자신은 번지를 잃고 상처받았으면서도 '평화를 배달하러 한다'는 역설이 아이러니를 형성하며, 개발의 폭력성을 더욱 강하게 고발합니다."},
      ]
    },
    { genre:"현대소설",genreIcon:"小",title:"역마",author:"김동리",passage:`성기는 태어날 때부터 역마살이 끼었다 하였다. 한 곳에 정착하지 못하고 언제나 어딘가로 떠나고 싶어 하는 성질이었다.\n어머니 옥화는 아들이 떠날까 봐 늘 노심초사하였다. 장터 주막을 운영하며 아들을 붙잡아두려 했지만, 성기의 발은 이미 먼 길을 향해 있었다.\n결국 성기는 어느 봄날 말 한 마디 없이 길을 떠났다. 뒤돌아보지 않았다.`,
      questions:[
        {q:"'역마살'이라는 설정이 이 소설에서 갖는 기능으로 가장 적절한 것은?",options:["주인공의 불행이 운명적으로 결정되어 있음을 드러내는 숙명론적 장치","주인공의 자유로운 삶에 대한 동경을 긍정적으로 형상화한 것","당시 사회의 미신적 풍습을 사실적으로 기록한 것","주인공의 여행 능력이 뛰어남을 강조하는 설정","어머니와의 갈등을 신화적으로 미화하는 장치"],answer:0,explanation:"'역마살'은 정착하지 못하고 떠도는 운명을 민간 신앙적으로 표현한 것으로, 성기의 방랑이 개인의 선택이 아닌 운명적 숙명임을 드러내는 장치입니다."},
        {q:"어머니 옥화의 심리로 가장 적절한 것은?",options:["아들의 방랑을 응원하며 자유를 존중하는 태도","아들이 떠날까 봐 불안해하며 붙잡으려는 모성적 애착","아들의 역마살을 당연한 것으로 받아들이는 체념","아들을 키우기 위해 경제적 자립에 집중하는 실용적 태도","아들의 방랑이 가문의 수치라고 생각하는 권위적 태도"],answer:1,explanation:"노심초사하며 주막을 운영하면서까지 아들을 붙잡으려는 옥화의 행동은, 떠날까 봐 두려워하는 강한 모성적 애착의 표현입니다."},
        {q:"성기가 '뒤돌아보지 않고' 떠나는 장면의 서사적 의미로 가장 적절한 것은?",options:["어머니에 대한 원망을 행동으로 표현한 것","역마살(운명)에 순응하여 정착의 삶을 완전히 포기하는 결단을 보여주는 것","새로운 삶에 대한 두려움을 극복하는 성장을 나타내는 것","어머니의 만류를 무시하는 불효를 드러내는 것","방랑 생활에 지쳐 모든 것을 포기하는 것"], answer:1,explanation:"뒤돌아보지 않고 길을 떠나는 행위는 정착의 삶(어머니·주막)을 완전히 뒤로 하고 운명(역마살)에 순응하여 방랑의 삶을 선택하는 결단의 표현입니다."},
      ]
    },
    { genre:"고전시가",genreIcon:"歌",title:"속미인곡 (일부)",author:"정철",passage:`어와 내 일이야 이리야 어이할꼬\n내 님을 내 모시어 내 님의 말씀 들으리\n뉘라서 내 뜻 알아 이 내 슬픔 알리오\n아아 날이 저물거다 서산에 해 지거다\n어디 가 날밤 새워 새벽을 기다리고 오리`,
      questions:[
        {q:"속미인곡에서 화자의 슬픔의 근원으로 가장 적절한 것은?",options:["자연의 아름다움을 즐기지 못하는 안타까움","임(임금)과 이별하여 곁에서 모시지 못하는 그리움과 절망","전쟁으로 고향을 떠나야 하는 슬픔","늙어가는 자신에 대한 자조","사랑하는 연인을 만나지 못하는 안타까움"],answer:1,explanation:"사미인곡의 속편인 속미인곡에서도 화자(정철)는 임금을 그리워하는 연군지정을 여성 화자의 이별 슬픔으로 형상화하여 표현합니다."},
        {q:"'날이 저물거다 서산에 해 지거다'에서 석양 이미지가 하는 역할로 가장 적절한 것은?",options:["화자가 아름다운 자연 풍경에 감탄하는 것","하루가 끝나가도록 임을 만나지 못한 절망감과 슬픔을 심화하는 것","저녁이 되어 집으로 돌아갈 시간임을 알리는 것","임금이 서쪽으로 피난 갔음을 암시하는 것","계절의 변화로 인한 쓸쓸함을 표현하는 것"],answer:1,explanation:"해가 지는 석양은 날이 다 가도록 임을 만나지 못한 상황과 결합하여 화자의 절망과 슬픔을 더욱 깊게 심화하는 배경 이미지입니다."},
        {q:"사미인곡과 속미인곡의 관계로 가장 적절한 것은?",options:["사미인곡은 산문, 속미인곡은 운문 형식의 작품이다.","속미인곡은 사미인곡의 속편으로, 두 여인의 대화 형식을 도입하여 내용을 심화한다.","사미인곡은 임금을, 속미인곡은 연인을 그리워하는 다른 내용이다.","두 작품은 서로 다른 작가가 주고받은 화답가이다.","속미인곡은 사미인곡의 내용을 비판하며 반론을 제기한 작품이다."],answer:1,explanation:"속미인곡은 사미인곡의 속편으로, 사미인곡이 한 화자의 독백이라면 속미인곡은 두 여인의 대화 형식을 도입하여 임에 대한 그리움을 더욱 극적으로 심화한 작품입니다."},
      ]
    },
    { genre:"고전소설",genreIcon:"傳",title:"흥부전 (일부)",author:"작자 미상",passage:`흥부가 박을 타니 그 속에서 온갖 보화가 쏟아져 나왔다. 금은보화, 쌀가마니, 비단이 넘쳐흘렀다. 흥부 가족은 춤을 추며 기뻐하였다.\n이 소문이 놀부에게 전해지자 놀부는 즉시 제비 다리를 일부러 부러뜨리고 고쳐주었다. 이듬해 제비가 씨앗을 물어왔고, 놀부도 박을 탔다. 그러나 놀부의 박에서는 도깨비, 귀신, 빚쟁이들이 쏟아져 나와 놀부 집안은 하루아침에 몰락하였다.`,

  const refDay = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const diff = Math.floor((cur - refDay) / 86400000);
  for (let i = 0; i <= diff; i++) {
    const d = new Date(refDay);
    d.setDate(refDay.getDate() + i);
    if (weekdays.includes(d.getDay())) count++;
  }
  const setIdx = Math.max(0, count - 1) % 12;
  const genreIdx = (Math.max(0, count - 1)) % 4;
  return { setIdx, genreIdx };
}

            { name: '풍자', def: '사회·인물의 잘못을 비웃어 비판', ex: '양반전, 허생전, 토끼전' },
            { name: '우의적 표현', def: '다른 사물·이야기를 빌려 주제를 간접 표현', ex: '사씨남정기 — 장희빈 사건을 우의적으로 비판' },
          ],
          questions: [
            { q: '홍길동전에서 홍길동이 서얼 차별 제도 때문에 고통받는 것은 어떤 갈등인가?', options: ['내적 갈등','외적 갈등(인물 vs 사회)','외적 갈등(인물 vs 인물)','외적 갈등(인물 vs 자연)'], answer: 1, exp: '개인(홍길동)이 사회 구조(서얼 차별 제도)와 충돌하는 외적 갈등(인물 vs 사회)입니다.' },
            { q: '양반전, 허생전처럼 사회나 인물의 결점을 비웃어 비판하는 방식은?', options: ['우의','복선','풍자','역설'], answer: 2, exp: '풍자는 사회나 인물의 잘못을 간접적으로 비웃어 비판하는 문학적 방식입니다.' },
            { q: '사씨남정기에서 사씨와 교씨 이야기로 실제 정치 사건을 간접 표현한 방식은?', options: ['복선','풍자','우의적 표현','액자 구조'], answer: 2, exp: '다른 이야기를 빌려 실제 사건을 간접 비판하는 우의적 표현입니다.' },
          ]
        },
      ]
    },
  ];

  // ── CONCEPT SCREEN ──
  if (screen === "concept") {
    const curTab = CONCEPTS[conceptTab];
    const curSection = curTab.sections[conceptSub !== null ? conceptSub : 0];
    const cKey = conceptTab + "-" + (conceptSub !== null ? conceptSub : 0);
    const cAnswers = conceptAnswers[cKey] || {};
    const cRevealed = conceptRevealed[cKey] || {};
    const allCAns = curSection.questions.every((_,i) => cAnswers[i] !== undefined);
    const allCRev = curSection.questions.every((_,i) => cRevealed[i]);
    const cScore = curSection.questions.filter((q,i) => cAnswers[i] === q.answer).length;

    function handleCAnswer(qi, oi) {
      if (cRevealed[qi]) return;
      setConceptAnswers(p => ({ ...p, [cKey]: { ...p[cKey], [qi]: oi } }));
    }
    function handleCRevealAll() {
      const nr = {};
      curSection.questions.forEach((_,i) => nr[i] = true);
      setConceptRevealed(p => ({ ...p, [cKey]: nr }));
    }

    return (
      <div style={{ minHeight: "100vh", background: "#f7f5f0", fontFamily: "'Noto Sans KR', sans-serif", paddingBottom: 60 }}>
        <div style={{ background: "#1a1a1a", padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: "#fff" }}>📖 개념 학습</div>
          <button onClick={() => { setScreen("home"); setConceptSub(null); }} style={{ background: "none", border: "1px solid #333", color: "#888", padding: "7px 12px", borderRadius: 8, fontSize: 12 }}>나가기</button>
        </div>

        {/* Tab bar */}
        <div style={{ background: "#fff", borderBottom: "1px solid #ebebeb", overflowX: "auto" }}>
          <div style={{ display: "flex" }}>
            {CONCEPTS.map((c, i) => (
              <button key={i} onClick={() => { setConceptTab(i); setConceptSub(0); }} style={{ flex: "0 0 auto", padding: "12px 14px", background: "none", border: "none", borderBottom: conceptTab === i ? "3px solid " + c.color : "3px solid transparent", fontSize: 12, color: conceptTab === i ? c.color : "#aaa", fontWeight: conceptTab === i ? 700 : 400, whiteSpace: "nowrap" }}>
                {c.icon} {c.tab}
              </button>
            ))}
          </div>
        </div>

        <div style={{ maxWidth: 600, margin: "0 auto", padding: "14px 14px" }}>
          {/* Section selector */}
          {conceptSub === null ? (
            <div>
              <div style={{ fontSize: 13, color: "#888", marginBottom: 12 }}>학습할 섹션을 선택하세요</div>
              {curTab.sections.map((s, si) => (
                <button key={si} onClick={() => setConceptSub(si)} style={{ width: "100%", padding: "16px 18px", background: "#fff", border: "1.5px solid " + curTab.color + "44", borderRadius: 12, marginBottom: 10, textAlign: "left", cursor: "pointer" }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: curTab.color, marginBottom: 4 }}>{s.title}</div>
                  <div style={{ fontSize: 12, color: "#888" }}>{s.desc}</div>
                  <div style={{ fontSize: 11, color: "#aaa", marginTop: 6 }}>개념 {s.items.length}개 · 확인문제 {s.questions.length}개</div>
                </button>
              ))}
            </div>
          ) : (
            <div>
              <button onClick={() => setConceptSub(null)} style={{ background: "none", border: "none", color: curTab.color, fontSize: 13, fontWeight: 600, marginBottom: 14, padding: 0, cursor: "pointer" }}>← 목록으로</button>

              {/* Section title */}
              <div style={{ background: curTab.bg, borderRadius: 12, padding: "14px 16px", marginBottom: 16, borderLeft: "4px solid " + curTab.color }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: curTab.color }}>{curSection.title}</div>
                <div style={{ fontSize: 12, color: "#666", marginTop: 4 }}>{curSection.desc}</div>
              </div>

              {/* Concept items */}
              {curSection.items.map((item, ii) => (
                <div key={ii} style={{ background: "#fff", borderRadius: 10, padding: "14px 16px", marginBottom: 8, border: "1px solid #ebebeb" }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: curTab.color, marginBottom: 6 }}>{item.name}</div>
                  <div style={{ fontSize: 13, color: "#333", marginBottom: 6, lineHeight: 1.6 }}>{item.def}</div>
                  <div style={{ fontSize: 12, color: "#888", background: curTab.bg, borderRadius: 6, padding: "6px 10px" }}>예시: {item.ex}</div>
                </div>
              ))}

              {/* Quiz section */}
              <div style={{ margin: "20px 0 10px", fontSize: 14, fontWeight: 700, color: "#1a1a1a" }}>✅ 개념 확인 문제</div>
              {curSection.questions.map((q, qi) => {
                const chosen = cAnswers[qi];
                const isRev = cRevealed[qi];
                const ok = chosen === q.answer;
                return (
                  <div key={qi} style={{ background: "#fff", borderRadius: 12, padding: "14px 14px", marginBottom: 10, border: isRev ? "1.5px solid " + (ok ? "#2d7a5f" : "#c0392b") : "1.5px solid #ebebeb" }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "#1a1a1a", marginBottom: 10, lineHeight: 1.6 }}>
                      <span style={{ display: "inline-block", background: curTab.color, color: "#fff", borderRadius: 4, padding: "1px 7px", fontSize: 11, marginRight: 6 }}>{qi + 1}</span>{q.q}
                    </div>
                    {q.options.map((opt, oi) => {
                      let bg = "#f9f9f9", border = "1px solid #ebebeb", color = "#333";
                      if (isRev) {
                        if (oi === q.answer) { bg = "#e8f4f0"; border = "1.5px solid #2d7a5f"; color = "#1a5c42"; }
                        else if (chosen === oi) { bg = "#fdecea"; border = "1.5px solid #c0392b"; color = "#922b21"; }
                      } else if (chosen === oi) { bg = curTab.bg; border = "1.5px solid " + curTab.color; color = curTab.color; }
                      return (
                        <button key={oi} disabled={isRev} onClick={() => handleCAnswer(qi, oi)} style={{ width: "100%", padding: "9px 12px", background: bg, border, borderRadius: 7, marginBottom: 6, color, fontSize: 13, display: "flex", gap: 8, alignItems: "flex-start", cursor: isRev ? "default" : "pointer" }}>
                          <span style={{ fontWeight: 700, minWidth: 14, flexShrink: 0 }}>{oi + 1}</span><span>{opt}</span>
                        </button>
                      );
                    })}
                    {isRev && (
                      <div style={{ marginTop: 8, padding: "8px 12px", background: "#f5f9f7", borderRadius: 7, fontSize: 12, color: "#444", lineHeight: 1.65, borderLeft: "3px solid " + curTab.color }}>
                        <strong style={{ color: curTab.color }}>해설</strong> {q.exp}
                      </div>
                    )}
                  </div>
                );
              })}

              {!allCRev && (
                <button disabled={!allCAns} onClick={handleCRevealAll} style={{ width: "100%", padding: 14, background: allCAns ? curTab.color : "#ccc", color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 700, marginTop: 4 }}>
                  {allCAns ? "채점하기" : "모든 문제를 풀어주세요"}
                </button>
              )}
              {allCRev && (
                <div style={{ background: cScore === curSection.questions.length ? "#e8f4f0" : "#fff8e8", border: "1.5px solid " + (cScore === curSection.questions.length ? "#2d7a5f" : curTab.color), borderRadius: 12, padding: 18, textAlign: "center", marginTop: 8 }}>
                  <div style={{ fontSize: 28, marginBottom: 6 }}>{cScore === curSection.questions.length ? "🎉" : "📖"}</div>
                  <div style={{ fontSize: 20, fontWeight: 700 }}>{cScore} / {curSection.questions.length} 정답</div>
                  <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>{cScore === curSection.questions.length ? "완벽해요! 다음 섹션으로 넘어가세요." : "틀린 문제의 해설을 다시 읽어보세요!"}</div>
                  <button onClick={() => { const next = conceptSub + 1; if (next < curTab.sections.length) { setConceptSub(next); setConceptAnswers({}); setConceptRevealed({}); } else setConceptSub(null); }} style={{ marginTop: 12, padding: "9px 18px", background: curTab.color, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                    {conceptSub + 1 < curTab.sections.length ? "다음 섹션 →" : "목록으로"}
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── PRACTICE ──
  return (
    <div style={{ minHeight: "100vh", background: "#f7f5f0", fontFamily: "'Noto Serif KR', Georgia, serif", paddingBottom: 60 }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap'); * { box-sizing: border-box; margin: 0; padding: 0; } input { outline: none; } button { cursor: pointer; }`}</style>

      {/* Header */}
      <div style={{ background: "#1a1a1a", padding: "14px 16px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 11, color: "#888", fontFamily: "'Noto Sans KR'", letterSpacing: 2 }}>수능 문학 연습</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>{studentName} 님</div>
          </div>
          <button onClick={() => setScreen("home")} style={{ background: "none", border: "1px solid #333", color: "#888", padding: "7px 12px", borderRadius: 8, fontSize: 12, fontFamily: "'Noto Sans KR'" }}>나가기</button>
        </div>
      </div>

      {/* Set selector */}
      <div style={{ background: "#fff", borderBottom: "1px solid #e8e8e8", overflowX: "auto" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", display: "flex", padding: "0 4px" }}>
          {SETS.map((_, si) => (
            <button key={si} onClick={() => setSelectedSet(si)} style={{ flex: "0 0 auto", padding: "10px 14px", background: "none", border: "none", borderBottom: selectedSet === si ? "2px solid #1a1a1a" : "2px solid transparent", fontFamily: "'Noto Sans KR'", fontSize: 12, color: selectedSet === si ? "#1a1a1a" : "#aaa", fontWeight: selectedSet === si ? 700 : 400, position: "relative" }}>
              SET {si + 1}{si === todaySet && <span style={{ position: "absolute", top: 6, right: 4, width: 5, height: 5, background: "#e8c84a", borderRadius: "50%" }} />}
            </button>
          ))}
        </div>
      </div>

      {/* Genre tabs */}
      <div style={{ background: "#fff", borderBottom: "1px solid #ebebeb" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", display: "flex" }}>
          {GENRES.map((g, gi) => {
            const c = GENRE_COLORS[g];
            return (
              <button key={gi} onClick={() => setSelectedGenre(gi)} style={{ flex: 1, padding: "12px 4px", background: "none", border: "none", borderBottom: selectedGenre === gi ? `3px solid ${c.accent}` : "3px solid transparent", fontFamily: "'Noto Sans KR'", fontSize: 11, color: selectedGenre === gi ? c.accent : "#aaa", fontWeight: selectedGenre === gi ? 700 : 400 }}>
                {g}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ maxWidth: 600, margin: "0 auto", padding: "16px 14px" }}>
        {/* Title card */}
        <div style={{ background: colors.bg, borderRadius: 12, padding: "16px 18px", marginBottom: 14, borderLeft: `4px solid ${colors.accent}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, background: colors.accent, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 700, flexShrink: 0 }}>{problem.genreIcon}</div>
            <div>
              <div style={{ fontSize: 11, color: colors.accent, fontWeight: 600, fontFamily: "'Noto Sans KR'", letterSpacing: 1 }}>SET {selectedSet + 1} · {problem.genre}</div>
              <div style={{ fontSize: 17, fontWeight: 700 }}>{problem.title}</div>
              <div style={{ fontSize: 12, color: "#666", fontFamily: "'Noto Sans KR'" }}>{problem.author}</div>
            </div>
          </div>
        </div>

        {/* Passage */}
        <button onClick={() => setShowPassage(!showPassage)} style={{ width: "100%", padding: "10px 16px", background: "#fff", border: `1px solid ${colors.light}`, borderRadius: 8, marginBottom: 8, fontFamily: "'Noto Sans KR'", fontSize: 13, color: colors.accent, fontWeight: 600, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span>📄 지문</span><span>{showPassage ? "▲ 접기" : "▼ 펼치기"}</span>
        </button>
        {showPassage && (
          <div style={{ background: "#fff", border: `1px solid ${colors.light}`, borderRadius: 10, padding: 18, marginBottom: 18, fontSize: 14, lineHeight: 2, color: "#2a2a2a", whiteSpace: "pre-line" }}>
            {problem.passage}
          </div>
        )}

        {/* Questions */}
        {problem.questions.map((q, qi) => {
          const chosen = qAnswers[qi];
          const isRev = qRevealed[qi];
          const ok = chosen === q.answer;
          return (
            <div key={qi} style={{ background: "#fff", borderRadius: 12, padding: "16px 14px", marginBottom: 12, border: isRev ? `1.5px solid ${ok ? "#2d7a5f" : "#c0392b"}` : "1.5px solid #ebebeb" }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#1a1a1a", marginBottom: 12, lineHeight: 1.6, fontFamily: "'Noto Sans KR'" }}>
                <span style={{ display: "inline-block", background: colors.accent, color: "#fff", borderRadius: 4, padding: "1px 7px", fontSize: 11, marginRight: 7 }}>{qi + 1}</span>{q.q}
              </div>
              {q.options.map((opt, oi) => {
                let bg = "#f9f9f9", border = "1px solid #ebebeb", color = "#333", icon = `${oi + 1}`;
                if (isRev) {
                  if (oi === q.answer) { bg = "#e8f4f0"; border = "1.5px solid #2d7a5f"; color = "#1a5c42"; icon = "✓"; }
                  else if (chosen === oi) { bg = "#fdecea"; border = "1.5px solid #c0392b"; color = "#922b21"; icon = "✗"; }
                } else if (chosen === oi) { bg = colors.light; border = `1.5px solid ${colors.accent}`; color = colors.accent; }
                return (
                  <button key={oi} disabled={isRev} onClick={() => handleAnswer(qi, oi)} style={{ width: "100%", padding: "10px 12px", background: bg, border, borderRadius: 7, marginBottom: 7, color, fontFamily: "'Noto Sans KR'", fontSize: 13, lineHeight: 1.5, display: "flex", gap: 8, alignItems: "flex-start", transition: "all 0.15s" }}>
                    <span style={{ fontWeight: 700, minWidth: 14, flexShrink: 0 }}>{icon}</span><span>{opt}</span>
                  </button>
                );
              })}
              {isRev && (
                <div style={{ marginTop: 10, padding: "10px 12px", background: "#f5f9f7", borderRadius: 7, fontSize: 12, color: "#444", fontFamily: "'Noto Sans KR'", lineHeight: 1.65, borderLeft: `3px solid ${colors.accent}` }}>
                  <strong style={{ color: colors.accent }}>해설</strong> {q.explanation}
                </div>
              )}
              {!isRev && chosen !== undefined && (
                <button onClick={() => handleRevealOne(qi)} style={{ marginTop: 8, padding: "7px 14px", background: "none", border: `1px solid ${colors.accent}`, borderRadius: 6, color: colors.accent, fontFamily: "'Noto Sans KR'", fontSize: 12, fontWeight: 600 }}>정답 확인</button>
              )}
            </div>
          );
        })}

        {!allRev && (
          <button disabled={!allAnswered} onClick={handleRevealAll} style={{ width: "100%", padding: 15, background: allAnswered ? colors.accent : "#ccc", color: "#fff", border: "none", borderRadius: 10, fontFamily: "'Noto Sans KR'", fontSize: 15, fontWeight: 700, marginTop: 4, transition: "all 0.2s" }}>
            {allAnswered ? "전체 채점하기" : "모든 문제를 풀어주세요"}
          </button>
        )}

        {allRev && (
          <div style={{ background: score === 3 ? "#e8f4f0" : score >= 2 ? colors.bg : "#fdecea", border: `1.5px solid ${score === 3 ? "#2d7a5f" : score >= 2 ? colors.accent : "#c0392b"}`, borderRadius: 12, padding: 20, textAlign: "center", marginTop: 4 }}>
            <div style={{ fontSize: 34, marginBottom: 6 }}>{score === 3 ? "🎉" : score === 2 ? "👍" : "📚"}</div>
            <div style={{ fontSize: 22, fontWeight: 700 }}>{score} / 3 정답</div>
            <div style={{ fontFamily: "'Noto Sans KR'", fontSize: 13, color: "#666", marginTop: 6 }}>{score === 3 ? "완벽합니다! 다음 갈래도 도전해보세요." : score === 2 ? "거의 다 맞았어요! 해설을 다시 확인해보세요." : "해설을 꼼꼼히 읽고 다시 도전해보세요!"}</div>
            <button onClick={() => { setSelectedGenre((selectedGenre + 1) % 4); setShowPassage(true); }} style={{ marginTop: 14, padding: "10px 20px", background: colors.accent, color: "#fff", border: "none", borderRadius: 8, fontFamily: "'Noto Sans KR'", fontSize: 13, fontWeight: 600 }}>다음 갈래 →</button>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
